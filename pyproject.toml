[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "media-workspace"
version = "0.1.0"
description = "Self-hosted image creation workspace with proposals, references and durable jobs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "pydantic>=2,<3", "httpx>=0.27,<1", "requests>=2.31,<3",
  "Pillow>=10,<13", "python-jose[cryptography]>=3.3,<4", "bcrypt>=4,<6",
  "python-multipart>=0.0.9", "cos-python-sdk-v5>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=2,<3", "websockets>=15,<16"]
voice = ["numpy>=2,<3", "sherpa-onnx>=1.12.20,<2", "websockets>=15,<16", "av>=18.1,<19"]
mysql = ["pymysql>=1.1,<2"]

[project.scripts]
media-workspace = "media.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["media"]

[tool.pytest.ini_options]
testpaths = ["media/tests"]
